services:
  postgres:
    image: postgres:17-alpine
    container_name: leadgentool-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: leadgen
      POSTGRES_PASSWORD: leadgen_local
      POSTGRES_DB: leadgentool
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
